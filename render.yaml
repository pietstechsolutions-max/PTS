# Render.com blueprint - deploy with "New +" -> "Blueprint" and point it at this repo.
services:
  - type: web
    name: piets-hq
    runtime: docker
    plan: starter          # needs a paid plan for the persistent disk below
    region: ohio
    healthCheckPath: /healthz
    disk:
      name: piets-data
      mountPath: /app/server/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        value: https://hq.pietstechsolutions.com   # change to your Render URL or custom domain
      - key: DB_PATH
        value: /app/server/data/piets.db
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OWNER_PHONE
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "Piets Technology Solutions <pietstechsolutions@gmail.com>"
